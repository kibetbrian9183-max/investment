<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PrimeVest - Transaction History</title>

<link rel="stylesheet" href="css/history.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <a href="profile.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
    </a>

    <h2>Transaction History</h2>

</header>


<main>

    <!-- =========================
         INVESTMENT HISTORY
    ========================== -->

    <section class="history-section">

        <h3>
            <i class="fas fa-chart-line"></i>
            Investments
        </h3>

        <div id="investmentHistory">

            <p class="empty">
                No investments yet.
            </p>

        </div>

    </section>


    <!-- =========================
         RECHARGE HISTORY
    ========================== -->

    <section class="history-section">

        <h3>
            <i class="fas fa-plus-circle"></i>
            Wallet Recharges
        </h3>

        <div id="rechargeHistory">

            <p class="empty">
                No recharge transactions yet.
            </p>

        </div>

    </section>


    <!-- =========================
         EARNINGS HISTORY
    ========================== -->

    <section class="history-section">

        <h3>
            <i class="fas fa-gift"></i>
            Earnings
        </h3>

        <div id="earningsHistory">

            <p class="empty">
                No earnings claimed yet.
            </p>

        </div>

    </section>


    <!-- =========================
         WITHDRAWAL HISTORY
    ========================== -->

    <section class="history-section">

        <h3>
            <i class="fas fa-wallet"></i>
            Withdrawals
        </h3>

        <div id="withdrawHistory">

            <p class="empty">
                No withdrawals yet.
            </p>

        </div>

    </section>

</main>


<nav class="bottom-nav">

    <a href="home.html">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>

    <a href="products.html">
        <i class="fas fa-box"></i>
        <span>Products</span>
    </a>

    <a href="profile.html" class="active">
        <i class="fas fa-user"></i>
        <span>Profile</span>
    </a>

</nav>


<script src="js/history.js"></script>

</body>

</html>
