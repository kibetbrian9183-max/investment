<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrimeVest</title>

<link rel="stylesheet" href="css/home.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- Header -->

<header>

<div class="top-bar">

<div>
<h2 id="welcomeUser">Welcome</h2>
<p>Investment Platform</p>
</div>

<div class="profile-icon">
<i class="fas fa-user-circle"></i>
</div>

</div>

</header>

<!-- Wallet -->

<section class="wallet">

<div class="balance-card">

<h3>Available Balance</h3>

<h1 id="balance">KSh 0</h1>

<div class="wallet-buttons">

<button id="receiveBtn">
<i class="fas fa-gift"></i>
Receive
</button>

<button id="rechargeBtn">
<i class="fas fa-plus-circle"></i>
Recharge
</button>

<button id="withdrawBtn">
<i class="fas fa-wallet"></i>
Withdraw
</button>

</div>

</div>

</section>

<!-- Products -->

<section class="products">

<h2>Investment Products</h2>

<div id="productList">

</div>

</section>

<!-- Live Activity -->

<div id="liveActivity" class="live-activity">

<div class="bolt">
⚡
</div>

<div>

<small>LIVE ACTIVITY</small>

<p id="activityText"></p>

</div>

</div>

<!-- Bottom Navigation -->

<nav>

<a href="home.html" class="active">
<i class="fas fa-home"></i>
<span>Home</span>
</a>

<a href="#">
<i class="fas fa-chart-line"></i>
<span>Products</span>
</a>

<a href="#">
<i class="fas fa-users"></i>
<span>Team</span>
</a>

<a href="profile.html">
<i class="fas fa-user"></i>
<span>Profile</span>
</a>

</nav>

<script src="js/home.js"></script>

</body>

</html>
