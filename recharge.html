<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recharge Wallet</title>

<link rel="stylesheet" href="css/recharge.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<h2>Recharge Wallet</h2>

</header>

<div class="card">

<h3>Current Wallet Balance</h3>

<h1 id="balance">KSh 0</h1>

<input
type="tel"
id="phone"
placeholder="Safaricom Number (2547XXXXXXXX)">

<input
type="number"
id="amount"
placeholder="Enter Recharge Amount">

<button id="payBtn">

Pay via M-Pesa

</button>

<p id="status"></p>

</div>

<div class="history">

<h2>Recharge History</h2>

<div id="historyList">

<p>No recharge history.</p>

</div>

</div>

<nav>

<a href="home.html">
<i class="fas fa-home"></i>
<span>Home</span>
</a>

<a href="profile.html">
<i class="fas fa-user"></i>
<span>Profile</span>
</a>

</nav>

<script src="js/recharge.js"></script>

</body>

</html>
